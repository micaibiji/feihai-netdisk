services:
  feihai-drive:
    build: .
    container_name: feihai-drive
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "12366:12366"
    volumes:
      - ${FEIHAI_DATA_PATH:-./data}:/app/data
      - ${FNTV_STRM_PATH:-./strm}:/app/strm
    security_opt:
      - no-new-privileges:true
    depends_on:
      - pansou

  pansou:
    image: ghcr.io/fish2018/pansou:latest
    container_name: feihai-pansou
    restart: unless-stopped
    environment:
      PORT: "8888"
      CHANNELS: ${PANSOU_CHANNELS:-tgsearchers3}
      CACHE_TTL: "60"
      PLUGIN_TIMEOUT: "20"
    volumes:
      - pansou-cache:/app/cache

volumes:
  pansou-cache:
