services:
  feihai-drive:
    build: .
    container_name: feihai-drive
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENLIST_URL: http://gateway:5244
    ports:
      - "12366:12366"
    volumes:
      - ./app:/app/app:ro
      - ${FEIHAI_DATA_PATH:-./data}:/app/data
      - ${FNTV_STRM_PATH:-./strm}:/app/strm
    security_opt:
      - no-new-privileges:true
    depends_on:
      - pansou
      - gateway

  pansou:
    image: ghcr.io/fish2018/pansou:latest
    container_name: feihai-pansou
    restart: unless-stopped
    environment:
      PORT: "8888"
      CHANNELS: ${PANSOU_CHANNELS:-tgsearchers3}
      CACHE_TTL: "60"
      PLUGIN_TIMEOUT: "20"
    volumes:
      - pansou-cache:/app/cache

  gateway:
    image: openlistteam/openlist:latest
    container_name: feihai-gateway
    restart: unless-stopped
    user: "0:0"
    environment:
      UMASK: "022"
      TZ: Asia/Shanghai
      OPENLIST_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      - ${FEIHAI_DATA_PATH:-./data}/gateway:/opt/openlist/data

volumes:
  pansou-cache:
