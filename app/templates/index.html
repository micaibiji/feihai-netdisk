<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">FEIHAI DRIVE</p>
          <h1>{{ app_name }}</h1>
          <p class="subtitle">只留下真正需要的网盘影视自动化。</p>
        </div>
        <span class="badge">私人版 · v0.1</span>
      </header>

      <section class="grid" id="providerGrid"></section>

      <section class="panel">
        <div class="panel-title">
          <div><p class="eyebrow">资源发现</p><h2>Telegram + 网盘搜索</h2></div>
        </div>
        <form id="searchForm" class="search-form">
          <label>影视名称<input name="q" placeholder="输入电影、剧集或综艺名称" required></label>
          <button type="submit">开始搜索</button>
        </form>
        <div class="results" id="searchResults"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div><p class="eyebrow">自动追更</p><h2>订阅关键词</h2></div>
        </div>
        <form id="subscriptionForm" class="search-form">
          <label>追更名称<input name="keyword" placeholder="例如：庆余年 第二季" required></label>
          <button type="submit">添加追更</button>
        </form>
        <div class="subscriptions" id="subscriptionList"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div><p class="eyebrow">快速入库</p><h2>添加分享链接</h2></div>
        </div>
        <form id="intakeForm">
          <label>片名<input name="title" placeholder="例如：流浪地球 2" required></label>
          <label>分享链接<input name="share_url" type="url" placeholder="粘贴移动、夸克、百度或115链接" required></label>
          <label>保存目录<input name="target_folder" value="影视"></label>
          <button type="submit">加入处理队列</button>
        </form>
        <p class="message" id="message"></p>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div><p class="eyebrow">最近活动</p><h2>任务记录</h2></div>
          <button class="ghost" id="refreshButton" type="button">刷新</button>
        </div>
        <div class="jobs" id="jobList"><p class="empty">正在加载…</p></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
