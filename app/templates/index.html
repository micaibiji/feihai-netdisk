<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b7a47">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css?v=041">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-page="home" aria-label="返回首页"><span class="brand-mark"><i></i><i></i><i></i></span><b>飞海网盘</b><em>PRIVATE</em></button>
    <form id="globalSearch" class="global-search"><span>⌕</span><input name="q" placeholder="搜索影视作品与网盘资源" autocomplete="off"><kbd>Enter</kbd></form>
    <nav class="top-nav"><button data-page="home" class="active">首页</button><button data-page="search">资源搜索</button><button data-page="following">我的追更</button><button data-page="library">媒体库</button></nav>
    <button id="systemState" class="health" data-page="risk"><i></i><span>正在检查</span></button><button class="avatar" data-page="settings">飞</button>
  </header>

  <aside class="rail">
    <button data-page="home" class="active"><span>⌂</span><b>首页</b></button>
    <button data-page="search"><span>⌕</span><b>资源搜索</b></button>
    <button data-page="following"><span>◎</span><b>我的追更</b></button>
    <button data-page="library"><span>▦</span><b>媒体库</b></button>
    <button data-page="accounts"><span>☁</span><b>网盘账号</b></button>
    <button data-page="risk"><span>◇</span><b>风险中心</b></button>
    <button data-page="settings"><span>⚙</span><b>设置</b></button>
  </aside>

  <main id="app" class="page-area"><section class="loading-card"><span class="spinner"></span><h1>正在启动飞海网盘</h1><p>读取榜单、网盘与追更状态…</p></section></main>

  <nav class="mobile-nav">
    <button data-page="home" class="active"><span>⌂</span>首页</button><button data-page="search"><span>⌕</span>搜索</button><button data-page="following"><span>◎</span>追更</button><button data-page="library"><span>▦</span>媒体库</button><button data-page="accounts"><span>☁</span>账号</button><button data-page="risk"><span>◇</span>风控</button>
  </nav>
  <div id="sessionGate" class="session-gate" hidden>
    <form id="sessionGateForm" class="session-gate-card">
      <div class="gate-mark"><span><i></i><i></i><i></i></span></div>
      <small>飞海网盘 · 本次访问验证</small>
      <h2>请输入验证密码</h2>
      <p>每次新打开飞海网盘，都需要验证管理密码才能查看内容。</p>
      <label><span>验证密码</span><input name="password" type="password" autocomplete="current-password" required autofocus placeholder="请输入管理密码"></label>
      <p class="gate-error"></p>
      <button class="primary" type="submit">验证并进入 <i>→</i></button>
      <em>密码只在你的飞牛 NAS 内验证</em>
    </form>
  </div>
  <div id="modalRoot"></div><div id="toastRoot"></div>
  <script src="/static/app.js?v=041"></script>
</body>
</html>
