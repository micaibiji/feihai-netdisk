<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087443">
  <title>登录 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/login.css?v=040">
</head>
<body>
  <main class="login-shell">
    <section class="welcome">
      <div class="brand"><span><i></i><i></i><i></i></span><b>飞海网盘</b><em>PRIVATE</em></div>
      <div class="welcome-copy">
        <small>FEIHAI MEDIA CLOUD</small>
        <h1>你的私人影视云，<br>现在可以开始了。</h1>
        <p>115、百度、夸克与移动网盘统一管理，为飞牛影视自动整理。</p>
      </div>
      <div class="features"><span>⌕ 全网资源搜索</span><span>◎ 多来源自动追更</span><span>▦ 飞牛影视整理</span></div>
    </section>
    <section class="login-panel">
      <form method="post" action="/login">
        <div class="mobile-brand">飞海网盘</div>
        <span class="eyebrow">本机 NAS 安全登录</span>
        <h2>欢迎回来</h2>
        <p class="hint">请输入部署时设置的管理账号和密码。</p>
        <label><span>管理账号</span><input name="username" autocomplete="username" required autofocus placeholder="请输入账号"></label>
        <label><span>管理密码</span><input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <button type="submit">进入飞海网盘 <i>→</i></button>
        <div class="security"><i>✓</i><span><b>只在你的 NAS 内验证</b><small>账号与密码不会发送到外部服务</small></span></div>
      </form>
    </section>
  </main>
</body>
</html>
